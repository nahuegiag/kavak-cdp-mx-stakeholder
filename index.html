  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #21262d;
      --border-light: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --blue: #0467FC;
      --accent: #00B4D8;
      --green: #2DC653;
      --warning: #FFD166;
      --danger: #E63946;
      --orange: #FF6B35;
      --purple: #A371F7;
      --header-h: 60px;
      --nav-h: 44px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── HEADER ─────────────────────────── */
    header {
      position: sticky; top: 0; z-index: 100;
      height: var(--header-h);
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center;
      padding: 0 clamp(16px, 3vw, 32px); gap: 16px;
    }
    .logo { font-size: 22px; font-weight: 800; letter-spacing: 2px; color: var(--blue); }
    .header-divider { width: 1px; height: 28px; background: var(--border-light); }
    .header-title { font-size: 13px; font-weight: 500; color: var(--text-muted); line-height: 1.3; }
    .header-spacer { flex: 1; }
    .presentation-btn {
      padding: 6px 14px; border: 1px solid var(--border-light);
      border-radius: 6px; background: transparent; color: var(--text-muted);
      font-size: 11px; font-family: 'Inter', sans-serif; cursor: pointer;
      transition: all 0.15s;
    }
    .presentation-btn:hover { background: rgba(255,255,255,0.06); color: var(--text); }

    /* ── NAV TABS ───────────────────────── */
    nav {
      position: sticky; top: var(--header-h); z-index: 99;
      height: var(--nav-h);
      background: var(--card); border-bottom: 1px solid var(--border);
      display: flex; align-items: stretch; justify-content: center; gap: 0;
    }
    .tab-btn {
      padding: 0 32px; border: none; background: transparent;
      color: var(--text-muted); font-family: 'Inter', sans-serif;
      font-size: 13px; font-weight: 500; cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--text); border-bottom-color: var(--blue); }

    /* ── MAIN LAYOUT ───────────────────── */
    main { padding: clamp(16px, 2vw, 24px) clamp(16px, 3vw, 32px); max-width: 1600px; margin: 0 auto; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ── TEMPORAL CONTROLS ──────────────── */
    .temporal-controls {
      display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap;
    }
    .toggle-group {
      display: inline-flex; border: 1px solid var(--border-light);
      border-radius: 8px; overflow: hidden; background: var(--bg);
    }
    .toggle-group__btn {
      padding: 7px 18px; border: none; background: transparent;
      color: var(--text-muted); font-family: 'Inter', sans-serif;
      font-size: 12px; font-weight: 500; cursor: pointer;
      transition: background 0.15s, color 0.15s; white-space: nowrap;
    }
    .toggle-group__btn:not(:last-child) { border-right: 1px solid var(--border-light); }
    .toggle-group__btn:hover { color: var(--text); background: rgba(255,255,255,0.04); }
    .toggle-group__btn.active { background: var(--blue); color: #fff; }
    #month-selector {
      padding: 6px 10px; background: var(--card); color: var(--text);
      border: 1px solid var(--border-light); border-radius: 6px;
      font-family: 'Inter', sans-serif; font-size: 12px; cursor: pointer;
    }
    .loading-badge {
      font-size: 11px; color: var(--text-muted);
      background: var(--card); border: 1px solid var(--border);
      padding: 4px 10px; border-radius: 10px; display: none;
    }
    .loading-badge.visible { display: inline-block; }

    /* ── SANKEY CONTAINER ───────────────── */
    #sankey-container {
      width: 100%;
      height: clamp(420px, 55vh, 620px);
      position: relative;
    }
    #sankey-container svg { width: 100%; height: 100%; }
    #sankey-state { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }

    /* ── FLOW SUMMARY CARDS ─────────────── */
    .flow-cards {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 16px; margin-top: 20px;
    }
    .flow-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 18px 24px; text-align: center;
      position: relative; overflow: hidden;
    }
    .flow-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    }
    .flow-card--entradas::before { background: var(--green); }
    .flow-card--saldo::before { background: var(--text-muted); }
    .flow-card--salidas::before { background: var(--danger); }
    .flow-card__label {
      font-size: 10px; font-weight: 600; letter-spacing: 1px;
      text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px;
    }
    .flow-card__value { font-size: 34px; font-weight: 800; line-height: 1.1; }
    .flow-card--entradas .flow-card__value { color: var(--green); }
    .flow-card--saldo .flow-card__value { color: var(--text); }
    .flow-card--salidas .flow-card__value { color: var(--danger); }
    .flow-card__sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

    /* ── FUNNEL TOGGLE ──────────────────── */
    .funnel-controls { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    #funnel-container {
      width: 100%; height: clamp(380px, 50vh, 560px); position: relative;
    }
    #funnel-container svg { width: 100%; height: 100%; }

    /* ── MOM TAB ────────────────────────── */
    .chart-grid-2 {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 20px;
    }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
    .card h3 { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 16px; }
    .chart-container { height: 300px; }
    .chart-container-tall { height: 400px; }

    /* ── RICH TOOLTIP ───────────────────── */
    #sk-tooltip {
      position: fixed; pointer-events: none;
      background: #1c2128; border: 1px solid var(--border-light);
      border-radius: 8px; padding: 12px 16px;
      font-size: 12px; color: var(--text);
      z-index: 9999; opacity: 0;
      transition: opacity 0.15s;
      max-width: 280px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .stt-header { font-weight: 700; font-size: 13px; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
    .stt-row { display: flex; justify-content: space-between; align-items: center; padding: 2px 0; gap: 12px; }
    .stt-row__label { color: var(--text-muted); }
    .stt-row__value { font-weight: 600; }
    .stt-section { margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--border); }
    .stt-section__title { font-size: 9px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; }
    .stt-channel { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
    .stt-channel__dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

    /* ── MISC ───────────────────────────── */
    .loading { display: flex; align-items: center; gap: 10px; color: var(--text-muted); }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid var(--border-light);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-state { text-align: center; color: var(--text-muted); }
    .error-state p { margin-bottom: 6px; }
    .positive { color: var(--green); }
    .negative { color: var(--danger); }

    /* ── PRESENTATION MODE ──────────────── */
    body.presentation-mode header,
    body.presentation-mode nav { display: none; }
    body.presentation-mode main { padding-top: 16px; max-width: 100%; }
    body.presentation-mode #sankey-container { height: calc(100vh - 260px); }

    @media (max-width: 768px) {
      .flow-cards { grid-template-columns: 1fr; }
      .temporal-controls { flex-direction: column; align-items: flex-start; }
    }
    @media (min-height: 900px) {
      #sankey-container { height: 600px; }
    }

<script>
(function () {
  const HASH = '475304296ba0f8bb572406b9134b40a88e38c5935a63fa446f40854265d01812';

  async function sha256(str) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  window.checkAuth = async function () {
    const val = document.getElementById('auth-input').value;
    const h   = await sha256(val);
    if (h === HASH) {
      sessionStorage.setItem('auth', '1');
      document.getElementById('auth-gate').remove();
    } else {
      const err = document.getElementById('auth-error');
      err.style.display = 'block';
      document.getElementById('auth-input').value = '';
    }
  };

  if (sessionStorage.getItem('auth') === '1') {
    document.getElementById('auth-gate').remove();
  }
})();
</script>

/* ═══════════════════════════════════════════════════════════
   UTILS
═══════════════════════════════════════════════════════════ */
function fmtN(n) {
  if (n == null || isNaN(n)) return '—';
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return String(Math.round(n));
}

function fmtPct(p) {
  if (p == null || isNaN(p)) return '—';
  return p.toFixed(1) + '%';
}

function fmtDelta(d) {
  if (d == null || isNaN(d)) return '—';
  return (d > 0 ? '+' : '') + fmtN(d);
}

function hex2rgb(hex, a) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  if (a !== undefined) return `rgba(${r},${g},${b},${a})`;
  return `${r},${g},${b}`;
}

function nodeColor(nodeId) {
  const id = nodeId.replace(/^from_|^to_/, '');
  if (id === 'NEW_TO_CDP') return '#2DC653';
  if (id === 'CHURNED')    return '#E63946';
  return SEG_COLORS[id] || '#8B949E';
}

function destroyChart(id) {
  if (charts[id]) { charts[id].destroy(); delete charts[id]; }
}

const charts = {};

async function apiFetch(path, signal) {
  if (window.STATIC_DATA) return staticLookup(path);
  const r = await fetch(API + path, signal ? { signal } : {});
  if (!r.ok) throw new Error(`HTTP ${r.status}: ${r.statusText}`);
  return r.json();
}

function staticLookup(path) {
  const [pathname, search] = path.split('?');
  const params = new URLSearchParams(search || '');
  if (pathname === '/api/sankey/enriched') {
    const mode = params.get('mode') || 'accumulated';
    if (mode === 'accumulated') return window.STATIC_DATA.sankey_accumulated;
    const month = params.get('month');
    if (month && window.STATIC_DATA.sankey_monthly[month]) return window.STATIC_DATA.sankey_monthly[month];
    const first = Object.values(window.STATIC_DATA.sankey_monthly)[0];
    if (first) return first;
    throw new Error('No monthly data in static build');
  }
  if (pathname === '/api/funnel/ae')     return window.STATIC_DATA.funnel_ae;
  if (pathname === '/api/funnel/supply') return window.STATIC_DATA.funnel_supply;
  if (pathname === '/api/mom')           return window.STATIC_DATA.mom;
  throw new Error(`No static data for: ${path}`);
}

/* ═══════════════════════════════════════════════════════════
   TAB SYSTEM
═══════════════════════════════════════════════════════════ */
const tabLoaded = {};

function showTab(tabId, btn) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  btn.classList.add('active');
  if (!tabLoaded[tabId]) {
    tabLoaded[tabId] = true;
    if (tabId === 'tab-funnels')   loadFunnel('ae');
    if (tabId === 'tab-tendencia') loadMoM();
  }
}

/* ═══════════════════════════════════════════════════════════
   TAB 1 — SANKEY ENRICHED
═══════════════════════════════════════════════════════════ */
let currentMode = 'accumulated';
let abortCtrl   = null;

function setMode(mode, btn) {
  currentMode = mode;
  document.querySelectorAll('.toggle-group__btn').forEach(b => {
    if (b.closest('#tab-relacional')) b.classList.remove('active');
  });
  btn.classList.add('active');
  const sel = document.getElementById('month-selector');
  sel.style.display = mode === 'monthly' ? '' : 'none';
  loadEnriched();
}

async function loadEnriched() {
  if (abortCtrl) { abortCtrl.abort(); }
  abortCtrl = new AbortController();

  const badge = document.getElementById('loading-badge');
  badge.classList.add('visible');

  let path = `/api/sankey/enriched?mode=${currentMode}`;
  if (currentMode === 'monthly') {
    const sel = document.getElementById('month-selector');
    if (sel.value) path += `&month=${sel.value}`;
  }

  const state = document.getElementById('sankey-state');
  const container = document.getElementById('sankey-container');

  // Show loading spinner while keeping any previous render visible
  state.innerHTML = '';
  state.style.display = 'none';

  try {
    const data = await apiFetch(path, abortCtrl.signal);

    // Populate month selector on first load
    if (data.stats && data.stats.months_available) {
      const sel = document.getElementById('month-selector');
      const months = data.stats.months_available;
      if (sel.options.length === 0) {
        months.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m; opt.textContent = m;
          sel.appendChild(opt);
        });
        if (data.month) sel.value = data.month;
      }
    }

    // Update flow cards
    if (data.stats) {
      const s = data.stats;
      document.getElementById('fc-entradas').textContent = '+' + fmtN(s.total_entradas);
      document.getElementById('fc-saldo').textContent    = fmtN(s.total_saldo);
      document.getElementById('fc-salidas').textContent  = '-' + fmtN(s.total_salidas);
      document.getElementById('fc-entradas-sub').textContent = `vs ${data.prev_month || '—'}`;
      document.getElementById('fc-saldo-sub').textContent    = `Snapshot ${data.month || '—'}`;
      document.getElementById('fc-salidas-sub').textContent  = `vs ${data.prev_month || '—'}`;
    }

    renderSankeyEnriched(data, container, state);
  } catch (err) {
    if (err.name === 'AbortError') return;
    state.style.display = 'flex';
    state.innerHTML = `<div class="error-state"><p>⚠ Error cargando datos</p><p style="font-size:11px;margin-top:4px">${err.message}</p><button onclick="loadEnriched()" style="margin-top:10px;padding:6px 14px;background:var(--card);border:1px solid var(--border-light);color:var(--text);border-radius:6px;cursor:pointer;font-family:Inter,sans-serif">Reintentar</button></div>`;
  } finally {
    badge.classList.remove('visible');
  }
}

function renderSankeyEnriched(data, container, stateEl) {
  d3.select(container).selectAll('svg').remove();

  if (!data.nodes || data.nodes.length === 0) {
    stateEl.style.display = 'flex';
    stateEl.innerHTML = '<div class="error-state"><p>Sin datos de transición para este período.</p></div>';
    return;
  }

  stateEl.style.display = 'none';

  const W       = 1200;  // viewBox width — scales with CSS
  const H       = container.clientHeight || 500;
  const margin  = { top: 16, right: 240, bottom: 16, left: 180 };

  const svg = d3.select(container)
    .append('svg')
    .attr('viewBox', `0 0 ${W} ${H}`)
    .attr('preserveAspectRatio', 'xMidYMid meet')
    .style('width', '100%')
    .style('height', '100%');

  const totalFlow = d3.sum(data.links, d => d.value);
  const threshold = totalFlow * 0.005; // hide links < 0.5% of total

  const filteredLinks = data.links.filter(l => l.value >= threshold);
  const usedNodeIds   = new Set(filteredLinks.flatMap(l => [l.source, l.target]));
  const filteredNodes = data.nodes.filter(n => usedNodeIds.has(n.id));

  const sankey = d3.sankey()
    .nodeId(d => d.id)
    .nodeWidth(20)
    .nodePadding(14)
    .iterations(32)
    .extent([[margin.left, margin.top], [W - margin.right, H - margin.bottom]]);

  let computed;
  try {
    computed = sankey({
      nodes: filteredNodes.map(n => ({ ...n })),
      links: filteredLinks.map(l => ({ ...l })),
    });
  } catch (e) {
    stateEl.style.display = 'flex';
    stateEl.innerHTML = '<div class="error-state"><p>⚠ Error renderizando Sankey</p></div>';
    return;
  }

  // Enforce minimum node height
  computed.nodes.forEach(n => {
    const minH = 8;
    if (n.y1 - n.y0 < minH) {
      const cx = (n.y0 + n.y1) / 2;
      n.y0 = cx - minH / 2;
      n.y1 = cx + minH / 2;
    }
  });

  const { nodes: layoutNodes, links: layoutLinks } = computed;
  const tooltip = document.getElementById('sk-tooltip');

  // ── Pre-compute available vertical space for each 'to' node ──
  const sortedToNodes = layoutNodes
    .filter(n => n.side === 'to')
    .sort((a, b) => a.y0 - b.y0);
  const toAvailH = new Map();
  sortedToNodes.forEach((n, idx) => {
    const next = sortedToNodes[idx + 1];
    const spaceToNext = next ? (next.y0 - n.y0) : (H - margin.bottom - n.y0);
    toAvailH.set(n.id, Math.max(n.y1 - n.y0, Math.min(spaceToNext - 3, 72)));
  });

  // ── Gradient defs ──────────────────────
  const defs = svg.append('defs');
  layoutLinks.forEach((l, i) => {
    const srcC = nodeColor(l.source.id);
    const tgtC = nodeColor(l.target.id);
    const grad = defs.append('linearGradient')
      .attr('id', `sg-${i}`)
      .attr('gradientUnits', 'userSpaceOnUse')
      .attr('x1', l.source.x1).attr('x2', l.target.x0);
    grad.append('stop').attr('offset', '0%').attr('stop-color', srcC).attr('stop-opacity', 0.45);
    grad.append('stop').attr('offset', '100%').attr('stop-color', tgtC).attr('stop-opacity', 0.45);
  });

  // ── Links ──────────────────────────────
  const linkSel = svg.append('g')
    .attr('fill', 'none')
    .selectAll('path')
    .data(layoutLinks)
    .join('path')
      .attr('d', d3.sankeyLinkHorizontal())
      .attr('stroke', (_, i) => `url(#sg-${i})`)
      .attr('stroke-width', d => Math.max(1.5, d.width))
      .attr('stroke-opacity', 1)
      .style('cursor', 'pointer')
      .on('mouseenter', function (evt, d) {
        const pct = d.source.value > 0 ? (d.value / d.source.value * 100).toFixed(1) + '%' : '—';
        tooltip.innerHTML = `
          <div class="stt-header">${d.source.name} → ${d.target.name}</div>
          <div class="stt-row">
            <span class="stt-row__label">Usuarios</span>
            <span class="stt-row__value">${fmtN(d.value)}</span>
          </div>
          <div class="stt-row">
            <span class="stt-row__label">% de origen</span>
            <span class="stt-row__value">${pct}</span>
          </div>`;
        tooltip.style.opacity = '1';
        tooltip.style.left    = (evt.clientX + 14) + 'px';
        tooltip.style.top     = (evt.clientY - 8) + 'px';
      })
      .on('mousemove', evt => {
        tooltip.style.left = (evt.clientX + 14) + 'px';
        tooltip.style.top  = (evt.clientY - 8) + 'px';
      })
      .on('mouseleave', () => { tooltip.style.opacity = '0'; });

  // ── Nodes ──────────────────────────────
  const nodeG = svg.append('g')
    .selectAll('g')
    .data(layoutNodes)
    .join('g')
      .attr('transform', d => `translate(${d.x0},${d.y0})`);

  nodeG.append('rect')
    .attr('height', d => Math.max(2, d.y1 - d.y0))
    .attr('width',  d => d.x1 - d.x0)
    .attr('fill', d => nodeColor(d.id))
    .attr('rx', 3)
    .on('mouseenter', function (evt, d) {
      // Dim unconnected links
      linkSel.transition().duration(150).attr('stroke-opacity',
        l => (l.source === d || l.target === d) ? 0.8 : 0.03);
      showNodeTooltip(d, evt);
    })
    .on('mousemove', evt => {
      tooltip.style.left = (evt.clientX + 14) + 'px';
      tooltip.style.top  = (evt.clientY - 8) + 'px';
    })
    .on('mouseleave', () => {
      linkSel.transition().duration(200).attr('stroke-opacity', 1);
      tooltip.style.opacity = '0';
    });

  // ── Labels — only "from" nodes get static text; "to" nodes show info on hover ──
  nodeG.each(function (d) {
    const g     = d3.select(this);
    const nodeH = Math.max(0, d.y1 - d.y0);
    const nodeW = d.x1 - d.x0;

    if (d.side === 'from' || (!d.side && d.id !== 'CHURNED')) {
      g.append('text')
        .attr('x', -8)
        .attr('y', nodeH / 2)
        .attr('dy', '0.35em')
        .attr('text-anchor', 'end')
        .attr('fill', '#e6edf3')
        .attr('font-size', 11)
        .attr('font-family', 'Inter, sans-serif')
        .text(`${d.name} (${fmtN(d.value)})`);
    } else if (d.id === 'CHURNED') {
      g.append('text')
        .attr('x', nodeW + 8)
        .attr('y', nodeH / 2)
        .attr('dy', '0.35em')
        .attr('text-anchor', 'start')
        .attr('fill', '#E63946')
        .attr('font-size', 11)
        .attr('font-family', 'Inter, sans-serif')
        .text(`${d.name} (${fmtN(d.value)})`);
    }
    // "to" segment nodes: no static label — hover tooltip shows all details
  });
}

function showNodeTooltip(d, evt) {
  const tooltip = document.getElementById('sk-tooltip');

  if (!d.impact) {
    tooltip.innerHTML = `
      <div class="stt-header">${d.name}</div>
      <div class="stt-row">
        <span class="stt-row__label">Usuarios</span>
        <span class="stt-row__value">${fmtN(d.value)}</span>
      </div>`;
  } else {
    const channels = [
      { key: 'kuna',   label: 'Kuna',   color: CHANNEL_COLORS.kuna },
      { key: 'supply', label: 'Supply', color: CHANNEL_COLORS.supply },
      { key: 'sales',  label: 'Sales',  color: CHANNEL_COLORS.sales },
    ];
    const channelRows = channels.map(ch => {
      const imp = d.impact && d.impact[ch.key];
      if (!imp) return '';
      const wpp   = imp.wpp   || {};
      const email = imp.email || {};
      if (wpp.pct == null && email.pct == null) return '';
      return `<div class="stt-channel" style="flex-direction:column;align-items:flex-start;gap:2px;padding:3px 0">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:1px">
          <span class="stt-channel__dot" style="background:${ch.color}"></span>
          <span style="font-weight:600;color:${ch.color}">${ch.label}</span>
        </div>
        ${wpp.pct != null ? `<div style="padding-left:12px;color:#8b949e;font-size:10px">
          WPP &nbsp;<span style="color:#e6edf3;font-weight:600">${wpp.pct}%</span>
        </div>` : ''}
        ${email.pct != null ? `<div style="padding-left:12px;color:#8b949e;font-size:10px">
          Email <span style="color:#e6edf3;font-weight:600">${email.pct}%</span>
        </div>` : ''}
      </div>`;
    }).join('');

    const mdRow = d.md_pct != null && d.md_pct > 0 ? `
      <div class="stt-section">
        <div class="stt-section__title">Market Discount</div>
        <div class="stt-row">
          <span class="stt-row__label">Pool MD ≤15%</span>
          <span class="stt-row__value">${fmtPct(d.md_pct)}</span>
        </div>
      </div>` : '';

    tooltip.innerHTML = `
      <div class="stt-header">${d.name}</div>
      <div class="stt-row">
        <span class="stt-row__label">Saldo actual</span>
        <span class="stt-row__value">${fmtN(d.saldo)}</span>
      </div>
      <div class="stt-row">
        <span class="stt-row__label">Retención</span>
        <span class="stt-row__value">${fmtPct(d.retention_pct)}</span>
      </div>
      <div class="stt-section">
        <div class="stt-section__title">Alcance por canal</div>
        ${channelRows}
      </div>
      ${mdRow}`;
  }

  tooltip.style.opacity = '1';
  tooltip.style.left    = (evt.clientX + 14) + 'px';
  tooltip.style.top     = (evt.clientY - 8)  + 'px';
}

/* ═══════════════════════════════════════════════════════════
   TAB 2 — FUNNELS
═══════════════════════════════════════════════════════════ */
let currentFunnel = 'ae';
const funnelData  = {};

function setFunnel(type, btn) {
  currentFunnel = type;
  document.querySelectorAll('#tab-funnels .toggle-group__btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  if (funnelData[type]) {
    renderFunnel(funnelData[type]);
  } else {
    loadFunnel(type);
  }
}

async function loadFunnel(type) {
  const stateEl    = document.getElementById('funnel-state');
  const container  = document.getElementById('funnel-container');

  stateEl.innerHTML = '<div class="loading"><div class="spinner"></div><p>Cargando funnel…</p></div>';
  stateEl.style.display = 'flex';

  try {
    const data = await apiFetch(`/api/funnel/${type}`);
    funnelData[type] = data;
    stateEl.style.display = 'none';
    renderFunnel(data);
  } catch (err) {
    stateEl.style.display = 'flex';
    stateEl.innerHTML = `<div class="error-state"><p>⚠ Error cargando funnel</p><p style="font-size:11px">${err.message}</p><button onclick="loadFunnel('${type}')" style="margin-top:10px;padding:6px 14px;background:var(--card);border:1px solid var(--border-light);color:var(--text);border-radius:6px;cursor:pointer;font-family:Inter,sans-serif">Reintentar</button></div>`;
  }
}

function renderFunnel(data) {
  const container = document.getElementById('funnel-container');
  d3.select(container).selectAll('svg').remove();

  // Update funnel stats label
  const statsEl = document.getElementById('funnel-stats');
  if (data.stats) {
    if (data.funnel === 'ae') {
      const s = data.stats;
      statsEl.textContent = `Leads: ${fmtN(s.total_leads)} · Approved: ${fmtN(s.total_approved)} (${fmtPct(s.cvr_lead_to_approved)}) · Bills: ${fmtN(s.total_bills)} (${fmtPct(s.cvr_approved_to_bill)})`;
    } else {
      const s = data.stats;
      statsEl.textContent = `Register: ${fmtN(s.total_register)} · Sch: ${fmtN(s.total_scheduled)} (${fmtPct(s.cvr_reg_to_sch)}) · App: ${fmtN(s.total_approved)} (${fmtPct(s.cvr_sch_to_app)}) · Purch: ${fmtN(s.total_purchased)} (${fmtPct(s.cvr_app_to_pur)})`;
    }
  }

  if (!data.nodes || data.nodes.length === 0) {
    document.getElementById('funnel-state').style.display = 'flex';
    document.getElementById('funnel-state').innerHTML = '<div class="error-state"><p>Sin datos para este funnel.</p></div>';
    return;
  }

  const W      = 1100;
  const H      = container.clientHeight || 450;
  const margin = { top: 16, right: 160, bottom: 16, left: 180 };

  const svg = d3.select(container)
    .append('svg')
    .attr('viewBox', `0 0 ${W} ${H}`)
    .attr('preserveAspectRatio', 'xMidYMid meet')
    .style('width', '100%')
    .style('height', '100%');

  const sankey = d3.sankey()
    .nodeId(d => d.id)
    .nodeWidth(20)
    .nodePadding(8)
    .iterations(32)
    .extent([[margin.left, margin.top], [W - margin.right, H - margin.bottom]]);

  let computed;
  try {
    computed = sankey({
      nodes: data.nodes.map(n => ({ ...n })),
      links: data.links.filter(l => l.value > 0).map(l => ({ ...l })),
    });
  } catch { return; }

  // Enforce minimum node height
  computed.nodes.forEach(n => {
    const minH = 8;
    if (n.y1 - n.y0 < minH) {
      const cx = (n.y0 + n.y1) / 2;
      n.y0 = cx - minH / 2;
      n.y1 = cx + minH / 2;
    }
  });

  const { nodes: ln, links: ll } = computed;
  const tooltip = document.getElementById('sk-tooltip');

  // Gradient defs
  const defs = svg.append('defs');
  ll.forEach((l, i) => {
    const g = defs.append('linearGradient')
      .attr('id', `fg-${i}`)
      .attr('gradientUnits', 'userSpaceOnUse')
      .attr('x1', l.source.x1).attr('x2', l.target.x0);
    g.append('stop').attr('offset', '0%').attr('stop-color', funnelNodeColor(l.source)).attr('stop-opacity', 0.45);
    g.append('stop').attr('offset', '100%').attr('stop-color', funnelNodeColor(l.target)).attr('stop-opacity', 0.45);
  });

  // Links
  svg.append('g').attr('fill', 'none')
    .selectAll('path').data(ll).join('path')
      .attr('d', d3.sankeyLinkHorizontal())
      .attr('stroke', (_, i) => `url(#fg-${i})`)
      .attr('stroke-width', d => Math.max(1.5, d.width))
      .attr('stroke-opacity', 1)
      .on('mouseenter', function (evt, d) {
        const pct = d.source.value > 0 ? (d.value / d.source.value * 100).toFixed(1) + '%' : '—';
        tooltip.innerHTML = `<div class="stt-header">${d.source.name} → ${d.target.name}</div>
          <div class="stt-row"><span class="stt-row__label">Usuarios</span><span class="stt-row__value">${fmtN(d.value)} (${pct})</span></div>`;
        tooltip.style.opacity = '1';
        tooltip.style.left    = (evt.clientX + 14) + 'px';
        tooltip.style.top     = (evt.clientY - 8)  + 'px';
      })
      .on('mousemove', evt => {
        tooltip.style.left = (evt.clientX + 14) + 'px';
        tooltip.style.top  = (evt.clientY - 8) + 'px';
      })
      .on('mouseleave', () => { tooltip.style.opacity = '0'; });

  // Nodes + Labels
  const nodeG = svg.append('g').selectAll('g').data(ln).join('g')
    .attr('transform', d => `translate(${d.x0},${d.y0})`);

  nodeG.append('rect')
    .attr('height', d => Math.max(2, d.y1 - d.y0))
    .attr('width',  d => d.x1 - d.x0)
    .attr('fill',   d => funnelNodeColor(d))
    .attr('rx', 3);

  nodeG.append('text')
    .attr('x', d => d.stage === 'origin' ? -8 : (d.x1 - d.x0 + 8))
    .attr('y', d => (d.y1 - d.y0) / 2)
    .attr('dy', '0.35em')
    .attr('text-anchor', d => d.stage === 'origin' ? 'end' : 'start')
    .attr('fill', d => d.stage === 'drop' ? '#8b949e' : '#e6edf3')
    .attr('font-size', 11)
    .attr('font-family', 'Inter, sans-serif')
    .text(d => {
      const label = (SEG_LABELS[d.id.replace('from_', '')] || d.name);
      return `${label} (${fmtN(d.value)})`;
    });
}

function funnelNodeColor(d) {
  if (!d || !d.id) return '#8B949E';
  const id = d.id.replace('from_', '');
  if (id.startsWith('stage_')) return '#0467FC';
  if (id.startsWith('drop_'))  return '#484F58';
  return SEG_COLORS[id] || '#8B949E';
}

/* ═══════════════════════════════════════════════════════════
   TAB 3 — TENDENCIA (MoM)
═══════════════════════════════════════════════════════════ */
async function loadMoM() {
  const stateEl = document.getElementById('mom-state');
  stateEl.innerHTML = '<div class="loading"><div class="spinner"></div><p>Cargando tendencia…</p></div>';
  try {
    const d = await apiFetch('/api/mom');
    stateEl.innerHTML = '';
    renderAreaChart(d);
    renderDeltaChart(d);
  } catch (e) {
    stateEl.innerHTML = `<div class="error-state"><p>⚠ ${e.message}</p></div>`;
  }
}

function renderAreaChart(d) {
  destroyChart('chart-area');
  const ctx = document.getElementById('chart-area').getContext('2d');
  const labels = d.snapshots || [];
  const segs   = Object.keys(SEG_COLORS);
  charts['chart-area'] = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: segs.map(seg => ({
        label: SEG_LABELS[seg] || seg,
        data: labels.map((_, i) => (d.segments[seg] && d.segments[seg].values[i]) || 0),
        backgroundColor: hex2rgb(SEG_COLORS[seg], 0.7),
        borderColor: SEG_COLORS[seg],
        borderWidth: 1,
        fill: true,
      })),
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}: ${fmtN(ctx.raw)}` } },
      },
      scales: {
        x: { stacked: true, grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#8b949e', font: { size: 11 } } },
        y: { stacked: true, grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#8b949e', font: { size: 11 }, callback: v => fmtN(v) } },
      },
    },
  });
}

function renderDeltaChart(d) {
  destroyChart('chart-delta');
  const ctx = document.getElementById('chart-delta').getContext('2d');
  charts['chart-delta'] = new Chart(ctx, {
    type: 'line',
    data: {
      labels: d.snapshots || [],
      datasets: [{
        label: 'Net Delta',
        data: d.net_delta || [],
        borderColor: '#0467FC',
        backgroundColor: hex2rgb('#0467FC', 0.15),
        borderWidth: 2,
        pointRadius: 3,
        tension: 0.3,
        fill: true,
      }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ` Net Delta: ${fmtDelta(ctx.raw)}` } } },
      scales: {
        x: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#8b949e', font: { size: 11 } } },
        y: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#8b949e', font: { size: 11 }, callback: v => fmtN(v) } },
      },
    },
  });
}

   INIT
═══════════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
  tabLoaded['tab-relacional'] = true;
  loadEnriched();
});
